<!DOCTYPE html>
<html lang="kk" data-theme="paper" data-size="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Жас ерекшелік психологиясы — Электрондық оқу құралы</title>
  <meta name="description" content="Жас ерекшелік психологиясы пәні бойынша заманауи электрондық оқулық. Дәрістер, практикалық сабақтар, СӨЖ және интерактивті бақылау тесті." />
  <link rel="icon" type="image/svg+xml" href="./assets/images/1.png" />
  
  <!-- Қаріптер: Plus Jakarta Sans & Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <!-- Оқу прогресі индикаторы -->
  <div id="readingProgress" class="reading-progress-bar"></div>

  <!-- Бас навигация тақтасы -->
  <header class="top-navbar">
    <div class="nav-left">
      <button id="toggleSidebarBtn" class="menu-toggle-btn" aria-label="Мазмұнын ашу/жабу" title="Мазмұны">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="book-brand" role="button" tabindex="0" id="brandHomeBtn" style="cursor: pointer;">
        <span class="book-brand-title">Жас ерекшелік психологиясы</span>
        <span class="book-brand-subtitle">Электрондық оқу құралы</span>
      </div>
    </div>

    <!-- Бөлімдер бойынша жылдам навигация -->
    <nav class="nav-center" aria-label="Негізгі бөлімдер">
      <button class="nav-tab-btn" data-route="cover">Басты бет</button>
      <button class="nav-tab-btn" data-route="intro">Кіріспе</button>
      <button class="nav-tab-btn" data-route="lecture-1">Дәрістер</button>
      <button class="nav-tab-btn" data-route="practice-1">Практика</button>
      <button class="nav-tab-btn" data-route="selfwork-1">СӨЖ</button>
      <button class="nav-tab-btn" data-route="quiz">Бақылау тесті</button>
      <button class="nav-tab-btn" data-route="originals">Түпнұсқа файлдар (40 MHT)</button>
    </nav>

    <!-- Оқу құралдары (Өлшем, Тақырып, Іздеу) -->
    <div class="nav-right">
      <button id="openSearchBtn" class="control-btn" title="Оқулық бойынша іздеу (Ctrl+K)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span style="margin-left: 4px;">Іздеу</span>
      </button>

      <!-- Қаріп өлшемі -->
      <button id="fontDecBtn" class="control-btn" title="Қаріпті кішірейту">A-</button>
      <button id="fontIncBtn" class="control-btn" title="Қаріпті үлкейту">A+</button>

      <!-- Түс режимі -->
      <button id="themeToggleBtn" class="control-btn" title="Тақырыпты ауыстыру (Ақ / Сепия / Түнгі)">
        <span id="themeIcon">☀️</span>
      </button>

      <!-- Толық экран -->
      <button id="fullscreenBtn" class="control-btn" title="Толық экран режимі">⛶</button>
    </div>
  </header>

  <!-- Басты контейнер -->
  <div class="app-container">
    <!-- Сайдбар (Мазмұны) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Оқулық мазмұны</span>
        <input type="text" id="sidebarFilterInput" class="sidebar-search-input" placeholder="Бөлімдер бойынша сүзу..." />
      </div>
      <nav id="tocNav" class="toc-nav" aria-label="Оқулық тараулары">
        <!-- JavaScript толтырады -->
      </nav>
    </aside>

    <!-- Негізгі оқу алаңы -->
    <main class="content-area">
      <div id="readingContainer" class="reading-container">
        <!-- JavaScript динамикалық түрде парақты шығарады -->
      </div>
    </main>
  </div>

  <!-- Іздеу модаль терезесі -->
  <div id="searchModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 0.5rem; width: 100%;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="Тақырып немесе мазмұн бойынша іздеу..." style="width: 100%; border: none; outline: none; background: transparent; font-size: 1rem; color: var(--text-main);" />
        </div>
        <button id="closeSearchModalBtn" style="padding: 0.25rem 0.5rem; font-size: 1.25rem; color: var(--text-muted);">&times;</button>
      </div>
      <div id="searchResults" class="modal-body">
        <p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">Іздеу үшін кілт сөзді енгізіңіз (мысалы: Выготский, дағдарыс, жас кезеңдері)</p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
